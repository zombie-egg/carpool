# Nginx reverse proxy for the Li'an Campus Carpool Next.js app.
# Install to /etc/nginx/sites-available/lian-carpool and symlink into
# /etc/nginx/sites-enabled/, then run: sudo nginx -t && sudo systemctl reload nginx

upstream lian_carpool_upstream {
    # PM2 runs `next start` on this port.
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name carpool.example.com;   # <-- replace with your domain

    # Allow reasonably large form submissions.
    client_max_body_size 10m;

    # Gzip dynamic responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Long-term caching for Next.js hashed static assets.
    location /_next/static/ {
        proxy_pass http://lian_carpool_upstream;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://lian_carpool_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# After obtaining a TLS certificate (e.g. `sudo certbot --nginx -d carpool.example.com`),
# certbot rewrites this file to add the :443 server block automatically.
